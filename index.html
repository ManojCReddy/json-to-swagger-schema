<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON ⇄ Swagger / OpenAPI Schema</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  textarea { tab-size: 2; resize: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body class="bg-[#0d1117] text-slate-200 h-screen flex flex-col font-sans">

<header class="flex flex-wrap items-center gap-4 px-5 py-3 border-b border-slate-800 bg-[#010409]">
  <div class="flex items-center gap-2">
    <span class="w-3 h-3 rounded-full bg-red-500"></span><span class="w-3 h-3 rounded-full bg-yellow-400"></span><span class="w-3 h-3 rounded-full bg-green-500"></span>
    <h1 class="ml-3 font-semibold tracking-tight text-slate-100">JSON <span class="text-indigo-400">⇄</span> Swagger Schema</h1>
  </div>

  <div id="modeSwitch" class="flex rounded-lg bg-slate-800 p-1 text-sm" role="tablist">
    <button id="modeA" data-mode="A" class="mode-btn px-3 py-1 rounded-md">JSON → Swagger/OpenAPI YAML</button>
    <button id="modeB" data-mode="B" class="mode-btn px-3 py-1 rounded-md">Swagger/OpenAPI YAML → JSON</button>
  </div>

  <div id="optsA" class="flex items-center gap-2 text-sm">
    <label for="spec" class="text-slate-400">Spec</label>
    <select id="spec" class="bg-slate-800 border border-slate-700 rounded-md px-2 py-1">
      <option value="3.1">OpenAPI 3.1</option>
      <option value="3.0">OpenAPI 3.0</option>
      <option value="2.0">Swagger 2.0</option>
    </select>
    <label for="schemaName" class="text-slate-400 ml-2">Name</label>
    <input id="schemaName" value="Model" class="bg-slate-800 border border-slate-700 rounded-md px-2 py-1 w-32">
    <span id="detected" class="ml-2 text-xs px-2 py-1 rounded-full bg-indigo-500/20 text-indigo-300 hidden"></span>
  </div>

  <div id="optsB" class="hidden flex items-center gap-2 text-sm">
    <label class="text-slate-400">Output</label>
    <div class="flex rounded-lg bg-slate-800 p-1">
      <button data-out="schema" class="out-btn px-3 py-1 rounded-md">JSON Schema</button>
      <button data-out="mock" class="out-btn px-3 py-1 rounded-md">Mock JSON Payload</button>
    </div>
  </div>

  <button id="sample" class="ml-auto text-sm px-3 py-1 rounded-md border border-slate-700 hover:bg-slate-800">Load sample</button>
</header>

<div id="error" class="hidden items-start gap-2 px-5 py-2 bg-red-950 border-b border-red-800 text-red-200 text-sm" role="alert">
  <span>⚠</span><span id="errorMsg" class="font-mono whitespace-pre-wrap"></span>
</div>

<main class="flex-1 min-h-0 grid grid-cols-1 md:grid-cols-2">
  <section class="flex flex-col min-h-0 border-r border-slate-800">
    <div class="flex items-center justify-between px-4 py-2 bg-[#161b22] text-xs uppercase tracking-wider text-slate-400">
      <span id="inLabel">Input</span>
      <button id="copyIn" class="copy-btn normal-case px-2 py-1 rounded border border-slate-700 hover:bg-slate-700">Copy</button>
    </div>
    <textarea id="input" spellcheck="false" class="flex-1 min-h-0 w-full bg-[#0d1117] p-4 font-mono text-sm text-emerald-200 outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
  </section>
  <section class="flex flex-col min-h-0">
    <div class="flex items-center justify-between px-4 py-2 bg-[#161b22] text-xs uppercase tracking-wider text-slate-400">
      <span id="outLabel">Output</span>
      <button id="copyOut" class="copy-btn normal-case px-2 py-1 rounded border border-slate-700 hover:bg-slate-700">Copy</button>
    </div>
    <textarea id="output" readonly spellcheck="false" class="flex-1 min-h-0 w-full bg-[#0d1117] p-4 font-mono text-sm text-sky-200 outline-none"></textarea>
  </section>
</main>

<script>
(function () {
  'use strict';

  /* ---------------- YAML emitter ---------------- */
  function yamlScalar(v) {
    if (v === null) return 'null';
    if (typeof v === 'number' || typeof v === 'boolean') return String(v);

    if (s === '' || /^[\s]|[\s]$/.test(s) || /^[-?:,\[\]{}#&*!|>'"%@`]/.test(s) ||

        /^(true|false|null|yes|no|on|off|~)$/i.test(s) || /^[-+]?(\d[\d_]*\.?\d*([eE][-+]?\d+)?|\.\d+|0x[0-9a-f]+)$/i.test(s)) {
      return JSON.stringify(s);
    }
    return s;
  }
  function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
  function toYaml(v, indent) {
    var pad = new Array(indent + 1).join(' ');
    var lines = [];

      if (!v.length) return pad + '[]';
      v.forEach(function (item) {
        if (isObj(item) && Object.keys(item).length) {
          var sub = toYaml(item, indent + 2).split('\n');
          sub[0] = pad + '- ' + sub[0].slice(indent + 2);
          lines.push(sub.join('\n'));
        } else if (Array.isArray(item) && item.length) {
          var s2 = toYaml(item, indent + 2).split('\n');
          s2[0] = pad + '- ' + s2[0].slice(indent + 2);
          lines.push(s2.join('\n'));

      var keys = Object.keys(v);
      if (!keys.length) return pad + '{}';
      keys.forEach(function (k) {

    if (registries.length) {
      var first = Object.keys(registries[0])[0];
      if (first === undefined) throw new Error('No schemas found in the component block.');
      root = registries[0][first];
      return { root: root, name: first, pool: pool };
    }
    if (looksLikeSchema(doc)) return { root: doc, name: null, pool: pool };
    var keys = Object.keys(doc);
    if (keys.length && keys.every(function (k) { return looksLikeSchema(doc[k]); })) {
      keys.forEach(function (k) { pool[k] = doc[k]; });
      return { root: doc[keys[0]], name: keys[0], pool: pool };
    }
    throw new Error('Could not find a schema. Provide components.schemas, definitions, or a schema object with "type"/"properties".');
  }

  function resolveRef(ref, pool) {
    var m = /^#\/(?:components\/schemas|definitions|\$defs)\/(.+)$/.exec(ref);
    if (!m || !pool.hasOwnProperty(m[1])) throw new Error('Unresolvable $ref: ' + ref);
    return m[1];
  }

  function toJsonSchema(s, pool, usedDefs) {
    if (Array.isArray(s)) return s.map(function (x) { return toJsonSchema(x, pool, usedDefs); });
    if (!isObj(s)) return s;
    var o = {}, nullable = false;
    Object.keys(s).forEach(function (k) {
      var v = s[k];
      if (k === 'nullable' || k === 'x-nullable') { nullable = nullable || v === true; return; }
      if (k === 'discriminator' || k === 'xml' || k === 'externalDocs' || k === 'readOnly' && false) return;
      if (k === '$ref' && typeof v === 'string') {
        var name = resolveRef(v, pool); usedDefs[name] = true; o.$ref = '#/$defs/' + name; return;
      }
      if (k === 'x-oneOf') k = 'oneOf'; else if (k === 'x-anyOf') k = 'anyOf';
      if (k === 'properties') {
        o.properties = {};
        Object.keys(v || {}).forEach(function (p) { o.properties[p] = toJsonSchema(v[p], pool, usedDefs); });
      } else if (k === 'example' || k === 'default' || k === 'enum' || k === 'const') o[k] = v;
      else o[k] = toJsonSchema(v, pool, usedDefs);
    });
    if (o.exclusiveMinimum === true && typeof o.minimum === 'number') { o.exclusiveMinimum = o.minimum; delete o.minimum; }
    else if (o.exclusiveMinimum === false) delete o.exclusiveMinimum;
    if (o.exclusiveMaximum === true && typeof o.maximum === 'number') { o.exclusiveMaximum = o.maximum; delete o.maximum; }
    else if (o.exclusiveMaximum === false) delete o.exclusiveMaximum;
    if (nullable) {
      if (typeof o.type === 'string') o.type = [o.type, 'null'];
      else if (Array.isArray(o.type)) { if (o.type.indexOf('null') < 0) o.type.push('null'); }
      else o = { anyOf: [o, { type: 'null' }] };
    }
    return o;
  }

  function mockFor(s, pool, depth, stack, key) {
    if (depth > 12 || !isObj(s)) return null;
    if (s.$ref) {
      var n = resolveRef(s.$ref, pool);
      if (stack.indexOf(n) >= 0) return null;
      return mockFor(pool[n], pool, depth + 1, stack.concat(n), key);
    }
    if (s.example !== undefined) return s.example;
    if (Array.isArray(s.examples) && s.examples.length) return s.examples[0];
    if (s.default !== undefined) return s.default;
    if (s.const !== undefined) return s.const;
    if (Array.isArray(s.enum) && s.enum.length) return s.enum[0];
    if (Array.isArray(s.allOf)) {
      var acc = {}, nonObj;
      s.allOf.forEach(function (p) {
        var m = mockFor(p, pool, depth + 1, stack, key);
        if (isObj(m)) Object.assign(acc, m); else if (m !== null) nonObj = m;
      });
      return Object.keys(acc).length || nonObj === undefined ? acc : nonObj;
    }
    var alt = s.oneOf || s.anyOf || s['x-oneOf'] || s['x-anyOf'];
    if (Array.isArray(alt) && alt.length) return mockFor(alt[0], pool, depth + 1, stack, key);
    var type = Array.isArray(s.type) ? (s.type.filter(function (t) { return t !== 'null'; })[0] || 'null') : s.type;
    if (!type) type = s.properties ? 'object' : s.items ? 'array' : null;
    switch (type) {
      case 'object':
        var o = {};
        Object.keys(s.properties || {}).forEach(function (k) { o[k] = mockFor(s.properties[k], pool, depth + 1, stack, k); });
        return o;
      case 'array':
        var n2 = Math.max(1, s.minItems || 1);
        var arr = [];
        for (var i = 0; i < n2; i++) arr.push(mockFor(s.items || {}, pool, depth + 1, stack, key));
        return arr;
      case 'integer': return numMock(s, true);
      case 'number': return numMock(s, false);
      case 'boolean': return true;
      case 'string': return strMock(s, key);
      case 'null': return null;
    }
    return null;
  }
  function numMock(s, int) {
    var v = int ? 1 : 1.5;
    var lo = typeof s.minimum === 'number' ? s.minimum : null, hi = typeof s.maximum === 'number' ? s.maximum : null;
    if (typeof s.exclusiveMinimum === 'number') lo = s.exclusiveMinimum + (int ? 1 : 0.5);
    else if (s.exclusiveMinimum === true && lo !== null) lo += int ? 1 : 0.5;
    if (typeof s.exclusiveMaximum === 'number') hi = s.exclusiveMaximum - (int ? 1 : 0.5);
    else if (s.exclusiveMaximum === true && hi !== null) hi -= int ? 1 : 0.5;
    if (lo !== null && v < lo) v = lo;
    if (hi !== null && v > hi) v = hi;
    if (typeof s.multipleOf === 'number' && s.multipleOf > 0 && v % s.multipleOf !== 0) {
      var m = Math.ceil(v / s.multipleOf) * s.multipleOf;
      v = (hi !== null && m > hi) ? Math.floor(v / s.multipleOf) * s.multipleOf : m;
    }
    return v;
  }
  function strMock(s, key) {
    var f = s.format, v;
    switch (f) {
      case 'date-time': v = '2024-01-15T10:30:00Z'; break;
      case 'date': v = '2024-01-15'; break;
      case 'time': v = '10:30:00Z'; break;
      case 'email': v = 'user@example.com'; break;
      case 'uuid': v = '3fa85f64-5717-4562-b3fc-2c963f66afa6'; break;
      case 'uri': case 'url': v = 'https://example.com'; break;
      case 'hostname': v = 'example.com'; break;
      case 'ipv4': v = '192.168.0.1'; break;
      case 'ipv6': v = '2001:db8::1'; break;
      case 'byte': v = 'U3dhZ2dlciByb2Nrcw=='; break;
      case 'binary': v = 'binary-data'; break;
      case 'password': v = 'p@ssw0rd'; break;
      default: v = key ? 'example ' + key : 'string';
    }
    if (!f || f === 'password' || f === 'binary') {
      if (typeof s.minLength === 'number' && v.length < s.minLength) v = v + new Array(s.minLength - v.length + 1).join('x');
      if (typeof s.maxLength === 'number' && v.length > s.maxLength) v = v.slice(0, s.maxLength);
    }
    return v;
  }

  function specToJson(text, outMode) {
    var doc = parseYaml(text);
    var ex = extractSchema(doc);
    if (outMode === 'mock') return JSON.stringify(mockFor(ex.root, ex.pool, 0, ex.name ? [ex.name] : [], null), null, 2);
    var used = {}, out = { $schema: 'https://json-schema.org/draft/2020-12/schema' };
    var body = toJsonSchema(ex.root, ex.pool, used);
    if (ex.name && !body.title) out.title = ex.name;
    Object.assign(out, body);
    var defs = {}, queue = Object.keys(used);
    while (queue.length) {
      var n = queue.shift();
      if (defs[n]) continue;
      var u = {};
      defs[n] = toJsonSchema(ex.pool[n], ex.pool, u);
      Object.keys(u).forEach(function (k) { if (!defs[k]) queue.push(k); });
    }
    if (Object.keys(defs).length) out.$defs = defs;
    return JSON.stringify(out, null, 2);
  }

  /* ---------------- Samples ---------------- */
  var SAMPLE_A = JSON.stringify({
    id: 42, name: 'Ada Lovelace', email: 'ada@example.com', active: true, score: 9.5,
    createdAt: '2024-01-15T10:30:00Z', manager: null,
    tags: ['math', 'poetry'],
    address: { street: '12 St James Sq', zip: '10001' },
    orders: [{ sku: 'A-1', qty: 2 }, { sku: 'B-7', qty: 1, note: 'gift' }]
  }, null, 2);
  var SAMPLE_B = [
    'components:',
    '  schemas:',
    '    User:',
    '      type: object',
    '      required:',
    '        - id',
    '        - name',
    '      properties:',
    '        id:',
    '          type: integer',
    '          format: int64',
    '        name:',
    '          type: string',
    '        email:',
    '          type: string',
    '          format: email',
    '        status:',
    '          type: string',
    '          enum: [active, inactive]',
    '        nickname:',
    '          type: string',
    '          nullable: true',
    '        tags:',
    '          type: array',
    '          items:',
    '            type: string',
    '        address:',
    '          $ref: "#/components/schemas/Address"',
    '    Address:',
    '      type: object',
    '      properties:',
    '        street:',
    '          type: string',
    '        zip:',
    '          type: string'
  ].join('\n');

  /* ---------------- UI ---------------- */
  var $ = function (id) { return document.getElementById(id); };
  var state = { mode: 'A', out: 'schema' };
  var inputs = { A: SAMPLE_A, B: SAMPLE_B };
  var ACTIVE = ['bg-indigo-600', 'text-white'], IDLE = ['text-slate-300', 'hover:bg-slate-700'];

  function setActive(btn, on) {
    ACTIVE.forEach(function (c) { btn.classList.toggle(c, on); });
    IDLE.forEach(function (c) { btn.classList.toggle(c, !on); });
  }
  function showError(msg) {
    $('errorMsg').textContent = msg;
    $('error').classList.remove('hidden'); $('error').classList.add('flex');
  }
  function clearError() { $('error').classList.add('hidden'); $('error').classList.remove('flex'); }

  function render() {
    document.querySelectorAll('.mode-btn').forEach(function (b) { setActive(b, b.dataset.mode === state.mode); });
    document.querySelectorAll('.out-btn').forEach(function (b) { setActive(b, b.dataset.out === state.out); });
    var A = state.mode === 'A';
    $('optsA').classList.toggle('hidden', !A); $('optsB').classList.toggle('hidden', A);
    $('inLabel').textContent = A ? 'Input · JSON (payload or schema)' : 'Input · Swagger / OpenAPI YAML';
    $('outLabel').textContent = A ? 'Output · ' + $('spec').options[$('spec').selectedIndex].text + ' YAML'
      : 'Output · ' + (state.out === 'schema' ? 'JSON Schema' : 'Mock JSON payload');
    $('detected').classList.add('hidden');
    var text = $('input').value;
    if (!text.trim()) { clearError(); $('output').value = ''; return; }
    try {
      if (A) {
        var r = jsonToSpecYaml(text, $('spec').value, $('schemaName').value);
        $('output').value = r.text;
        $('detected').textContent = 'Detected: ' + r.kind;
        $('detected').classList.remove('hidden');
      } else $('output').value = specToJson(text, state.out);
      clearError();
    } catch (e) {
      showError(e.message || String(e));
    }
  }

  function setMode(m) {
    inputs[state.mode] = $('input').value;
    state.mode = m;
    $('input').value = inputs[m];
    $('output').value = '';
    render();
  }
  document.querySelectorAll('.mode-btn').forEach(function (b) { b.addEventListener('click', function () { setMode(b.dataset.mode); }); });
  document.querySelectorAll('.out-btn').forEach(function (b) { b.addEventListener('click', function () { state.out = b.dataset.out; render(); }); });
  ['input', 'spec', 'schemaName'].forEach(function (id) {
    $(id).addEventListener('input', render); $(id).addEventListener('change', render);
  });
  $('sample').addEventListener('click', function () { $('input').value = state.mode === 'A' ? SAMPLE_A : SAMPLE_B; render(); });

  function copy(btn, src) {
    var text = $(src).value, orig = 'Copy';
    function ok() {
      btn.textContent = '✓ Copied!';
      btn.classList.add('bg-green-600', 'border-green-500', 'text-white');
      setTimeout(function () { btn.textContent = orig; btn.classList.remove('bg-green-600', 'border-green-500', 'text-white'); }, 1500);
    }
    function fallback() {
      var ta = $(src), prevRO = ta.readOnly;
      ta.readOnly = false; ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) { showError('Copy failed: ' + e.message); }
      ta.readOnly = prevRO; ta.setSelectionRange(0, 0);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  }
  $('copyIn').addEventListener('click', function () { copy(this, 'input'); });
  $('copyOut').addEventListener('click', function () { copy(this, 'output'); });

  /* ---------------- Find / Replace ---------------- */
  var BTN = 'px-2 py-1 rounded border border-slate-700 hover:bg-slate-700';
  var FIELD = 'bg-slate-800 border border-slate-700 rounded-md px-2 py-1 text-sm min-w-0 flex-1 outline-none focus:ring-1 focus:ring-indigo-500 normal-case tracking-normal text-slate-200';
  var finders = {};

  function makeFinder(taId, canReplace) {
    var ta = $(taId);
    var bar = document.createElement('div');
    bar.className = 'hidden flex-col gap-1 px-3 py-2 bg-[#161b22] border-t border-slate-800 text-xs normal-case tracking-normal';
    bar.innerHTML =
      '<div class="flex flex-wrap items-center gap-1">' +
        '<input data-r="find" placeholder="Find" aria-label="Find" class="' + FIELD + '">' +
        '<button data-r="prev" title="Previous (Shift+Enter)" aria-label="Previous match" class="' + BTN + '">↑</button>' +
        '<button data-r="next" title="Next (Enter)" aria-label="Next match" class="' + BTN + '">↓</button>' +
        '<button data-r="case" title="Match case" aria-label="Match case" aria-pressed="false" class="' + BTN + '">Aa</button>' +
        '<button data-r="word" title="Whole word" aria-label="Whole word" aria-pressed="false" class="' + BTN + '">W</button>' +
        '<span data-r="count" class="text-slate-400 w-16 text-center"></span>' +
        '<button data-r="close" title="Close (Esc)" aria-label="Close" class="' + BTN + '">✕</button>' +
      '</div>' +
      (canReplace ?
      '<div class="flex flex-wrap items-center gap-1">' +
        '<input data-r="repl" placeholder="Replace" aria-label="Replace" class="' + FIELD + '">' +
        '<button data-r="one" class="' + BTN + '">Replace</button>' +
        '<button data-r="all" class="' + BTN + '">Replace all</button>' +
      '</div>' : '');
    ta.parentNode.insertBefore(bar, ta);
    var q = function (n) { return bar.querySelector('[data-r="' + n + '"]'); };
    var findEl = q('find'), replEl = q('repl'), countEl = q('count');
    var opts = { 'case': false, word: false };

    function regex() {
      var term = findEl.value;
      if (!term) return null;
      var src = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      if (opts.word) src = '(?<![A-Za-z0-9_])' + src + '(?![A-Za-z0-9_])';
      return new RegExp(src, opts['case'] ? 'g' : 'gi');
    }
    function matches() {
      var re = regex(), out = [], m;
      if (!re) return out;
      while ((m = re.exec(ta.value))) { out.push({ s: m.index, e: m.index + m[0].length }); if (!m[0].length) re.lastIndex++; }
      return out;
    }
    function select(m, all) {
      var keep = document.activeElement === findEl || document.activeElement === replEl ? document.activeElement : null;
      ta.focus();
      ta.setSelectionRange(m.s, m.e);
      if (keep) keep.focus();
      var i = all.indexOf(m) + 1;
      countEl.textContent = i + ' of ' + all.length;
    }
    function step(dir) {
      var all = matches();
      if (!all.length) { countEl.textContent = findEl.value ? 'No results' : ''; return false; }
      var pos = dir > 0 ? ta.selectionEnd : ta.selectionStart, pick;
      if (dir > 0) pick = all.filter(function (m) { return m.s >= pos; })[0] || all[0];
      else pick = all.filter(function (m) { return m.e <= pos; }).pop() || all[all.length - 1];
      select(pick, all);
      return true;
    }
    function changed() {
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    }
    function replaceOne() {
      var all = matches(), s = ta.selectionStart, e = ta.selectionEnd;
      var cur = all.filter(function (m) { return m.s === s && m.e === e; })[0];
      if (!cur) { step(1); return; }
      ta.setRangeText(replEl.value, s, e, 'end');
      changed();
      step(1);
    }
    function replaceAll() {
      var re = regex();
      if (!re) return;
      var n = 0, rep = replEl.value;
      ta.value = ta.value.replace(re, function () { n++; return rep; });
      countEl.textContent = n + ' replaced';
      changed();
    }
    function toggle(name, btn) {
      opts[name] = !opts[name];
      btn.setAttribute('aria-pressed', String(opts[name]));
      setActive(btn, opts[name]);
      step(1);
    }
    function open(focusReplace) {
      var sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
      if (sel && sel.indexOf('\n') < 0) findEl.value = sel;
      bar.classList.remove('hidden'); bar.classList.add('flex');
      (focusReplace && replEl ? replEl : findEl).focus();
      (focusReplace && replEl ? replEl : findEl).select();
    }
    function close() {
      bar.classList.add('hidden'); bar.classList.remove('flex');
      ta.focus();
    }

    q('next').addEventListener('click', function () { step(1); });
    q('prev').addEventListener('click', function () { step(-1); });
    q('case').addEventListener('click', function () { toggle('case', this); });
    q('word').addEventListener('click', function () { toggle('word', this); });
    q('close').addEventListener('click', close);
    if (canReplace) {
      q('one').addEventListener('click', replaceOne);
      q('all').addEventListener('click', replaceAll);
      replEl.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); replaceOne(); } });
    }
    findEl.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); step(ev.shiftKey ? -1 : 1); }
    });
    findEl.addEventListener('input', function () { countEl.textContent = ''; });
    bar.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { ev.preventDefault(); close(); } });
    setActive(q('case'), false); setActive(q('word'), false);
    return { ta: ta, bar: bar, open: open };
  }

  finders.input = makeFinder('input', true);
  finders.output = makeFinder('output', false);

  document.addEventListener('keydown', function (ev) {
    if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) return;
    var k = ev.key.toLowerCase();
    if (k !== 'f' && k !== 'h') return;
    var target = finders.input, active = document.activeElement;
    if (finders.output.ta === active || finders.output.bar.contains(active)) target = finders.output;
    ev.preventDefault();
    // Output is read-only (regenerated from input), so Ctrl+H falls back to find there
    target.open(k === 'h');
  });

  $('input').value = inputs.A;
  render();
  window.__converter = { parseYaml: parseYaml, toYaml: toYaml, jsonToSpecYaml: jsonToSpecYaml, specToJson: specToJson };
})();
</script>
</body>
